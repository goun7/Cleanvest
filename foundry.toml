[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
auto_detect_solc = false
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

# Deploy script'inin adresleri deploy-out/addresses.json'a yazmasi icin.
# Yalnizca bu dizinde yazma izni; baska yerde DEGIL.
fs_permissions = [{ access = "write", path = "./deploy-out/" }]

[fmt]
line_length = 100
