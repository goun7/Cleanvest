[package]
name = "aegisforge"
version = "1.0.0"
edition = "2021"
description = "AegisForge — Bağımsız B2B Akıllı Sözleşme Denetim Motoru (Deterministik Hash Taahhüdü)"
license = "MIT"

[[bin]]
name = "aegisforge"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.10"
